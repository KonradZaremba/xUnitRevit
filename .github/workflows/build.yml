# Build xUnitRevit Modern (.NET 8, Revit 2025-2027)
# Builds the headless addon and packs xUnitRevitUtils NuGet for each Revit version.

name: Build

on:
  push:
    branches: [master, 'feature/*']
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - revitVersion: '2025'
            configuration: 'Release2025'
          - revitVersion: '2026'
            configuration: 'Release2026'
          - revitVersion: '2027'
            configuration: 'Release2027'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore NuGet packages
        run: dotnet restore xUnitRevit.Modern/xUnitRevit.Modern.csproj

      - name: Build xUnitRevit.Modern
        run: dotnet build xUnitRevit.Modern/xUnitRevit.Modern.csproj -c ${{ matrix.configuration }} --no-restore

      - name: Build SampleLibrary.Modern
        run: dotnet build SampleLibrary.Modern/SampleLibrary.Modern.csproj -c Debug --no-restore

      - name: Pack xUnitRevitUtils
        run: dotnet pack xUnitRevitUtils/xUnitRevitUtils.csproj -c Release /p:RevitVersion=${{ matrix.revitVersion }} -o ./artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xUnitRevit-${{ matrix.revitVersion }}
          path: |
            xUnitRevit.Modern/bin/${{ matrix.configuration }}/net8.0-windows/
            SampleLibrary.Modern/bin/Debug/net8.0-windows/
            xUnitRevit.Modern/xUnitRevit.addin
            artifacts/*.nupkg

  publish-nuget:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Push to NuGet
        run: |
          foreach ($pkg in Get-ChildItem -Recurse -Filter *.nupkg) {
            dotnet nuget push $pkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
        shell: pwsh
